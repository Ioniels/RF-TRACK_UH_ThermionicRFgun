notes: >
  Two discrete-wavelength anchors only: 0.687 near 550 nm (visible-diagnostic band) and 0.713 at
  1064 nm (Nd:YAG pyrometry/laser band) on the UH cathode. Per plan Sec. 5.5: do NOT substitute
  these anchors directly for total hemispherical emissivity in a radiative-loss boundary
  condition -- they constrain the spectral model and the synthetic UH optical diagnostic response
  only. The effective radiative-loss model used by a thermal solver must carry its own separate
  dataset name and uncertainty (plan Sec. 5.5), not silently reuse these two points.
