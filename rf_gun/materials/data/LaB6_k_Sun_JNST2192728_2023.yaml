notes: >
  PLACEHOLDER DATA -- NOT YET DIGITIZED FROM THE ACTUAL SUN ET AL. 2023 PAPER. The five points
  in LaB6_k_Sun_JNST2192728_2023.csv (300-1273 K) are a reasonable smooth placeholder curve, not
  a real digitization: they anchor near k~=60-65 W/m/K at 300-400 K, decreasing toward
  ~55.6 W/m/K at 1273 K so the high-T end joins continuously with the Tanaka provisional points
  (55.5 W/m/K at 1300 K, see LaB6_k_Tanaka_OsakaThesis_1981.yaml), and is broadly consistent with
  the plan Sec. 19.3 engineering cross-check k_approx(T) = 13.3 + 5.33e4/T W/m/K, which gives
  k_approx(1273 K) ~= 55.2 W/m/K (that cross-check is itself "engineering check only, never
  production", plan Sec. 5.2). uncertainty.type=model / value=0.15 (15%) reflects this
  placeholder status, not a measured uncertainty. MUST BE REPLACED with the real digitized Sun
  2023 curve (temperature_K,value,uncertainty,source_point_id rows in the companion CSV) before
  any production physics claim -- this file exercises the csv_file loading path in
  rf_gun/materials/base.py's load_property_dataset_yaml() so that code path is real and tested
  even though the data behind it is not yet real.
